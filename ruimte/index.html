<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Oneindig · Ruimte</title>
  <meta name="description" content="Een eindeloze reis door een procedureel gegenereerd stuk melkweg: nevels, sterren, planeten en zwarte gaten.">
  <meta name="theme-color" content="#05060d">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="ruimte.css">
  <script type="importmap">
    { "imports": { "three": "../lib/three/three.module.min.js" } }
  </script>
</head>
<body class="space">
  <canvas id="scene"></canvas>

  <div id="hud">
    <header class="brand">
      <div class="logo"><span class="inf">∞</span> Oneindig</div>
      <div class="tag">een reis door de ruimte</div>
    </header>

    <div class="topbar">
      <nav class="worlds" aria-label="Wereld kiezen">
        <a href="../">Aarde</a>
        <a href="./" aria-current="page">Ruimte</a>
        <a href="../wolken/">Wolken</a>
      </nav>
      <button class="music" data-act="music" data-state="waiting" aria-pressed="false" title="Muziek aan/uit (M)" aria-label="Muziek aan/uit">
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="lbl">Klik voor muziek</span>
      </button>
    </div>

    <div id="region" class="region">
      <div class="rule"></div>
      <div id="regionName" class="name"></div>
      <div id="regionSub" class="sub"></div>
      <div class="rule"></div>
    </div>

    <div class="stats">
      <div class="stat"><span class="k">Afgelegd</span><span class="v"><span id="sDist">0.00</span><small>lichtjaar</small></span></div>
      <div class="stat"><span class="k">Snelheid</span><span class="v"><span id="sSpeed">0</span><small>× licht</small></span></div>
      <div class="stat"><span class="k">Dichtbij</span><span class="v" id="sNear">—</span></div>
      <div class="stat"><span class="k">Afstand</span><span class="v"><span id="sNearD">—</span><small>mln km</small></span></div>
    </div>

    <div class="controls">
      <div class="row desk"><kbd>←</kbd><kbd>→</kbd><span>draaien</span><kbd>Q</kbd><kbd>E</kbd><span>dalen / stijgen</span></div>
      <div class="row desk"><kbd>↑</kbd><kbd>↓</kbd><span>snelheid</span><kbd>N</kbd><span>volgende</span></div>
      <div class="row desk"><kbd>C</kbd><span>bioscoop</span><kbd>M</kbd><span>muziek</span></div>
      <div class="row desk"><kbd>spatie</kbd><span>pauze</span><kbd>H</kbd><span>verberg</span></div>
      <div class="row touch"><span>Sleep om te sturen</span></div>
      <div class="row touch btns">
        <button data-act="next">Volgende</button>
        <button data-act="pause">Pauze</button>
        <button data-act="cinema">Bioscoop</button>
        <button data-act="hide">Verberg</button>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <div id="loader">
    <div class="logo"><span class="inf">∞</span> Oneindig</div>
    <div class="track"><div id="loadbar"></div></div>
    <div class="hint">het heelal ontvouwt zich…</div>
  </div>

  <noscript><p class="nojs">Deze wereld heeft JavaScript en WebGL nodig.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
